name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LibertyRoute.sln

      - name: Build solution
        run: dotnet build LibertyRoute.sln --configuration Release --no-restore

      - name: Publish desktop app
        run: >
          dotnet publish
          src/LibertyRoute.Desktop/LibertyRoute.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/Desktop

      - name: Publish service app
        run: >
          dotnet publish
          src/LibertyRoute.Service/LibertyRoute.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/Service

      - name: Upload LibertyRoute build
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRoute-Windows
          path: publish/